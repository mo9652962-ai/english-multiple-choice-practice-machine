<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#486d5c" />
    <meta name="author" content="sora（mo9652962-ai）" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icons/brand-mark.png" />
    <title>墨题 · 英语刷题</title>
    <style>
      /* ═══ 水墨启动画面 v3.3（千轮研究：墨染江湖极简 + 古诗学习宝错峰动画）═══ */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background:
          radial-gradient(ellipse at 70% 20%, rgba(72,109,92,.06), transparent 55%),
          radial-gradient(ellipse at 15% 85%, rgba(164,52,42,.04), transparent 50%),
          #f8f5ef;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        transition: opacity .5s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      /* 远山剪影 */
      .splash-mountains { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 42%; pointer-events: none; animation: fadeIn 1.6s ease-out .2s both; }
      /* 墨滴 */
      .splash-ink { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(60,70,80,.16), transparent 70%); filter: blur(3px); pointer-events: none; animation: inkSpread 2.8s ease-out both; }
      .ink-1 { width: 240px; height: 240px; top: 6%; right: 4%; }
      .ink-2 { width: 150px; height: 150px; bottom: 22%; left: 3%; animation-delay: .5s; }
      .ink-3 { width: 90px; height: 90px; top: 45%; left: 12%; opacity: .5; animation-delay: 1s; }
      /* 内容区 */
      .splash-content { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 28px; }
      /* 印章（墨题）——弹入 */
      .splash-seal {
        width: 96px; height: 96px; border-radius: 50%;
        background: #a4342a; color: #f8f5ef;
        display: flex; align-items: center; justify-content: center;
        font-family: "Kaiti SC", "STKaiti", "楷体", serif;
        font-size: 30px; font-weight: 700; letter-spacing: 3px; text-indent: 3px;
        box-shadow: 0 10px 28px rgba(164,52,42,.35), inset 0 0 0 2px rgba(248,245,239,.25);
        animation: sealIn .6s cubic-bezier(.2,.8,.3,1.2) .15s both;
      }
      /* 品牌字——上浮淡入 */
      .splash-title {
        font-family: "Kaiti SC", "STKaiti", "楷体", serif;
        font-size: clamp(28px, 8vw, 38px);
        color: #2d2a26; letter-spacing: 8px; text-indent: 8px;
        margin-top: 26px; font-weight: 600;
        animation: riseIn .7s ease-out .45s both;
      }
      /* 副标题——淡入 */
      .splash-subtitle {
        display: flex; align-items: center; gap: 12px;
        color: #7a746b; font-size: 13px; letter-spacing: 3px; margin-top: 14px;
        animation: fadeIn .6s ease-out .9s both;
      }
      .splash-subtitle::before, .splash-subtitle::after { content: ''; width: 34px; height: 1px; background: rgba(72,109,92,.5); }
      .splash-caption {
        color: #9a948a; font-size: 12px; letter-spacing: 2px; margin-top: 10px;
        font-family: "Kaiti SC", "STKaiti", "楷体", serif;
        animation: fadeIn .6s ease-out 1.1s both;
      }
      /* 进度条——墨色 */
      .splash-progress { width: 180px; height: 3px; background: rgba(60,70,80,.12); border-radius: 99px; overflow: hidden; margin-top: 34px; animation: fadeIn .6s ease-out 1.2s both; }
      .splash-progress i { display: block; height: 100%; background: linear-gradient(90deg, #486d5c, #6b8a76); border-radius: 99px; animation: fill 2.4s ease-out .3s both; }
      @keyframes sealIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes riseIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fill { from { width: 0; } to { width: 100%; } }
      @keyframes inkSpread { from { transform: scale(.4); opacity: 0; } to { transform: scale(1.15); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, .splash-mountains, .splash-ink { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg class="splash-mountains" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 200 L0 158 Q58 88 128 150 Q176 96 230 138 Q298 76 358 128 Q390 106 400 118 L400 200 Z" fill="rgba(60,70,80,.09)"/>
        <path d="M0 200 L0 178 Q84 128 162 174 Q240 138 322 168 Q366 148 400 164 L400 200 Z" fill="rgba(60,70,80,.06)"/>
        <path d="M0 200 L0 190 Q100 160 200 184 Q300 160 400 178 L400 200 Z" fill="rgba(60,70,80,.04)"/>
      </svg>
      <div class="splash-ink ink-1"></div>
      <div class="splash-ink ink-2"></div>
      <div class="splash-ink ink-3"></div>
      <div class="splash-content">
        <div class="splash-seal">墨题</div>
        <h1 class="splash-title">墨题英语刷题机</h1>
        <div class="splash-subtitle">真题 · 单词 · 刷题</div>
        <p class="splash-caption">于墨香中提笔，在真题里精进</p>
        <div class="splash-progress"><i></i></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {})
      }
      // 水墨启动画面：2.9s 后淡出移除（app 在其下并行加载）
      setTimeout(() => {
        const s = document.getElementById('splash')
        if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 550) }
      }, 2900)
    </script>
  </body>
</html>
