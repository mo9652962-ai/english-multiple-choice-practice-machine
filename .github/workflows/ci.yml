name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npx vue-tsc --noEmit
      - name: Build
        run: cd frontend && npm run build

  backend-health:
    name: Backend tests and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests
        run: PYTHONPATH=backend python -m pytest -q tests
      - name: Import check
        run: |
          PYTHONPATH=backend python -c "import app.main; print('backend import ok')"

  repository-hygiene:
    name: Secret and privacy-file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject private files and high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(\.env|.*\.(db|sqlite|sqlite3|bak|backup|pfx|pem|key))$'; then
            echo 'A private database, secret, or backup file is tracked.' >&2
            exit 1
          fi
          if git grep -n -I -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,})' -- . ':!docs' ':!README*'; then
            echo 'A high-confidence secret pattern was found in tracked source.' >&2
            exit 1
          fi
