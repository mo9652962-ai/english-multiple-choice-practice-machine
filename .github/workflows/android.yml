name: Android build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install or require verified release content inputs
        shell: bash
        env:
          # Optional path supplied by a controlled runner/content-input step.
          EPM_RELEASE_CONTENT_BUNDLE_PATH: ${{ vars.EPM_RELEASE_CONTENT_BUNDLE_PATH }}
        run: |
          set -euo pipefail
          if [[ -n "${EPM_RELEASE_CONTENT_BUNDLE_PATH:-}" ]]; then
            python tools/prepare_release_content_bundle.py \
              --bundle "$EPM_RELEASE_CONTENT_BUNDLE_PATH"
          fi
          test -s frontend/public/question_bank.db
          sha256sum frontend/public/question_bank.db
      - name: Sync shared release metadata
        run: node scripts/sync_release_metadata.mjs
      - name: Build web assets
        run: npm run build
        working-directory: frontend
      - name: Check frontend entry bundle budget
        run: node tools/check_frontend_bundle.mjs --dist frontend/dist --max-entry-kb 512 --max-lazy-kb 1024
      - name: Check offline seed and migration contract
        run: node tools/check_offline_seed.mjs --db frontend/dist/question_bank.db --migrations frontend/dist/offline_migrations.json
      - name: Check offline runtime migration (legacy and fresh)
        run: node tools/check_offline_runtime.mjs frontend/dist/offline_migrations.json
      - name: Generate Capacitor Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
        working-directory: frontend
      - name: Sync tracked native plugins
        run: node scripts/sync_android_plugins.mjs
      - name: Sync Android version metadata
        run: node scripts/sync_android_version.mjs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      - name: Prepare Android release keystore for tagged build
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/epm-release.keystore"
          test -s "$RUNNER_TEMP/epm-release.keystore"

      - name: Assemble signed Android release APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          EPM_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/epm-release.keystore
          EPM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EPM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EPM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: frontend/android

      - name: Verify signed Android release APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          apk=frontend/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"

      - name: Verify APK contains offline seed and version metadata
        shell: bash
        run: |
          set -euo pipefail
          apks=("frontend/android/app/build/outputs/apk/debug/app-debug.apk")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            apks+=("frontend/android/app/build/outputs/apk/release/app-release.apk")
          fi
          for apk in "${apks[@]}"; do
            unzip -l "$apk" | grep -E 'assets/public/(question_bank\.db|offline_migrations\.json|release-metadata\.json)$'
            test -s "$apk"
          done
      - name: Verify APK offline assets match Web dist
        shell: bash
        run: |
          set -euo pipefail
          apks=("frontend/android/app/build/outputs/apk/debug/app-debug.apk")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            apks+=("frontend/android/app/build/outputs/apk/release/app-release.apk")
          fi
          for apk in "${apks[@]}"; do
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            for asset in question_bank.db offline_migrations.json release-metadata.json; do
              unzip -p "$apk" "assets/public/$asset" > "$tmp_dir/$asset"
              cmp -s "$tmp_dir/$asset" "frontend/dist/$asset"
              sha256sum "$tmp_dir/$asset" "frontend/dist/$asset"
            done
            rm -rf "$tmp_dir"
          done
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch debug APK in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: frontend/android
          script: |
            set -u
            evidence_dir="$GITHUB_WORKSPACE/android-emulator-evidence"
            mkdir -p "$evidence_dir"
            node "$GITHUB_WORKSPACE/tools/android_runtime_smoke.mjs" \
              --apk "$GITHUB_WORKSPACE/frontend/android/app/build/outputs/apk/debug/app-debug.apk" \
              --version-file "$GITHUB_WORKSPACE/VERSION" \
              --evidence-dir "$evidence_dir" \
              --extended-input \
              --emulator-rotation \
              --offline
      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epm-android-emulator-evidence-${{ github.sha }}
          path: android-emulator-evidence
          if-no-files-found: warn
      - name: Write Android release manifest
        run: |
          apk=frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            apk=frontend/android/app/build/outputs/apk/release/app-release.apk
          fi
          python tools/release_check.py \
            --offline-only \
            --offline-db frontend/dist/question_bank.db \
            --strict-quality \
            --require-android-metadata \
            --artifact "$apk" \
            --write-report android-release-manifest.json
      - name: Upload Android debug APK artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: epm-android-debug-${{ github.sha }}
          path: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            android-release-manifest.json
          if-no-files-found: error
      - name: Upload Android release APK artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: epm-android-release-${{ github.sha }}
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            android-release-manifest.json
          if-no-files-found: error
