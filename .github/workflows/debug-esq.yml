name: Debug ESQ fixture

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Inspect fixture bytes
        run: |
          md5sum examples/demo-bank.esq
          git ls-files --eol examples/demo-bank.esq
          python - <<'EOF'
          import zipfile
          with zipfile.ZipFile('examples/demo-bank.esq') as z:
              for n in z.namelist():
                  print(repr(n))
          EOF
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Reproduce failing test
        run: |
          PYTHONPATH=backend python -m pytest -q tests/test_esq.py -x 2>&1 | tail -30
      - name: Probe zip behavior on 3.11
        run: |
          python - <<'EOF'
          import sys, zipfile, io
          print(sys.version)
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, 'w') as z:
              z.writestr('answers/2026.json', '{}')
          with zipfile.ZipFile(io.BytesIO(buf.getvalue())) as z:
              print('writestr roundtrip:', z.namelist())
          from pathlib import PurePosixPath
          print('posix parts:', PurePosixPath('answers/2026.json').parts)
          try:
              import sys; sys.path.insert(0, 'backend')
              from app.services.esq import _safe_member
              print('safe member:', _safe_member('answers/2026.json'))
          except Exception as e:
              print('safe member error:', e)
          EOF
