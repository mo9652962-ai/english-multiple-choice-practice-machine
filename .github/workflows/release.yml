name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build NSIS and portable packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            electron/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Create clean seed database
        shell: pwsh
        env:
          EPM_DATA_DIR: ${{ github.workspace }}\backend\data
        run: |
          python -c "from backend.app.database import initialize_database; initialize_database()"
          python tools/verify_release_data.py --check-templates

      - name: Build backend executable
        run: python -m PyInstaller backend_app.spec --noconfirm
        working-directory: backend

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron
      - name: Build Windows installers
        # 禁用 electron-builder 自动 publish（publish 指向 epm-releases，github.token 无跨仓库权限）
        # 产物统一由下方 Publish 步骤发布
        run: npm run dist -- --publish never
        working-directory: electron

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $required = @(
            "electron/dist/epm-setup-$version.exe",
            "electron/dist/epm-portable-$version.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing release artifact: $path" }
          }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $assets = @(
            "electron/dist/epm-setup-$version.exe",
            "electron/dist/epm-setup-$version.exe.blockmap",
            "electron/dist/epm-portable-$version.exe",
            "electron/dist/latest.yml"
          )
          gh release create $env:GITHUB_REF_NAME $assets --repo $env:GITHUB_REPOSITORY --generate-notes --title "墨题 $version"
          if ($LASTEXITCODE -ne 0) {
            # Release 已存在时改为补充资产（幂等重跑）
            gh release upload $env:GITHUB_REF_NAME $assets --repo $env:GITHUB_REPOSITORY --clobber
          }
