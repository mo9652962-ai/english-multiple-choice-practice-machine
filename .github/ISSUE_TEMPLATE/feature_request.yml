name: Feature request
description: 建议新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 这个功能解决你的什么痛点？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 期望的交互/界面/行为
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 高（影响核心使用）
        - 中（显著改善体验）
        - 低（锦上添花）
    validations:
      required: true
