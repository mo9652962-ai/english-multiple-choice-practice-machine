name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？预期是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 1. 打开… 2. 点击… 3. 看到…
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页显示的版本号（如 2.0.0-beta.14）
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 桌面版
        - Web 网页版
        - Android 手机版
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 可选——错误日志或截图（%APPDATA%\ai-english-practice-desktop\logs\）
